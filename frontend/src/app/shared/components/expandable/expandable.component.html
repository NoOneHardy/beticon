<div class="heading" (pointerup)="toggle()">
  <span class="name">{{ name() }}</span>
  <button type="button" [class.-expanded]="expanded()">
    <span class="material-symbols-rounded">keyboard_arrow_down</span>
  </button>
</div>
@if (expanded()) {
  <div class="content" (animate.enter)="expand($event)" (animate.leave)="collapse($event)">
    <ng-content select="[bet-content]"/>
  </div>
} @else {
  <div class="preview" (animate.enter)="expand($event)" (animate.leave)="collapse($event)">
    <ng-content select="[bet-preview]"/>
  </div>
}
